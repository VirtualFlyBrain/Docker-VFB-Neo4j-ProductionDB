name: Archive release to Zenodo

# When a release is published here, deposit the knowledge graph to Zenodo with a
# DOI, as a new version of one long-lived record.
#
# How this is meant to be used:
#   1. Jenkins builds the dumps and promotes them to the public paths.
#   2. Once they are live, cut a release here, tagged with that day's date.
#   3. This job deposits the build products and records what was being served.
#
# So the release tag says WHEN the release was cut, and the deposit says WHAT
# was in it. Until now the only dated copies were the `previous-*` files in the
# Jenkins workspace, stamped with the date they were DISPLACED rather than the
# date their content went live, so working out which graph belonged to which
# release meant reasoning backwards through the rotation.
#
# ---------------------------------------------------------------------------
# WHAT IS DEPOSITED, AND WHY NOT THE NEO4J TARBALL
#
# dumps.Makefile builds pdb.owl by CONSTRUCT from the RDF4J triplestore, turns it
# into CSVs via owl2neo4jcsv.jar and imports those into Neo4j. The Neo4j store and
# the OWL are therefore sibling derivations of the same source — the 5.6 GB
# tarball is a Neo4j 4 binary store, which cannot be opened without a Neo4j 4
# binary. Depositing text serialisations instead keeps the deposit readable
# without VFB's stack, and small enough to sit inside Zenodo's free tier forever:
#
#   out/kb.ttl.gz   ~109 MB   the graph
#   out/fbbt.owl    ~120 MB   the exact FBbt this release was built against
#   out/seed.txt     ~69 MB   the build seed that pins the result
#
# Together those make the release reproducible, not merely retained. The two big
# served files are recorded in the manifest by URL, size and Last-Modified, so
# the deposit still says exactly what was being served, without carrying 12 GB.
#
# CONSISTENCY CHECK. out/ holds the LATEST BUILD, which is not always what is
# live — as of 16 Aug 2026 the out/ products were dated 12 Aug while the served
# graph was still 27 Jun, because no release had been cut in between. Cutting a
# release is what promotes a build, so at release time they should agree. The job
# warns loudly if they do not, because a silent mismatch would deposit one
# generation of the graph under a release that served another.
#
# Requires:
#   secrets.ZENODO_TOKEN   Zenodo personal access token, scopes deposit:write deposit:actions
#   vars.ZENODO_CONCEPT    (optional) numeric id of an existing Zenodo record.
#                          Leave unset for the first run; the run prints the id to set.
# ---------------------------------------------------------------------------

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to archive (defaults to the latest release)"
        required: false
      dry_run:
        description: "Download, checksum and print the manifest — deposit nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE: http://VirtualFlyBrain.org/data/VFB/OWL
      OWL_LIVE_URL: http://VirtualFlyBrain.org/data/VFB/OWL/owlery-live.owl
      PDB_LIVE_URL: http://data.virtualflybrain.org/archive/VFB-PDB-v4.tar.gz
      ZENODO_API: https://zenodo.org/api

    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo untagged)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Archiving graph as at release $TAG"

      - name: Probe the sources and check they are consistent
        id: probe
        env:
          RELEASED_AT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail
          : > sources.tsv   # name <TAB> url <TAB> bytes <TAB> last-modified
          : > served.tsv    # same, for the files that are not deposited

          probe() {  # file, name, url
            hdr=$(curl -sIL --max-time 120 "$3")
            len=$(printf '%s' "$hdr" | grep -i '^content-length:' | tail -1 | tr -dc '0-9')
            mod=$(printf '%s' "$hdr" | grep -i '^last-modified:'  | tail -1 | cut -d' ' -f2- | tr -d '\r')
            [ -n "$len" ] && [ -n "$mod" ] || { echo "::error::$3 gave no Content-Length/Last-Modified"; exit 1; }
            printf '%s\t%s\t%s\t%s\n' "$2" "$3" "$len" "$mod" >> "$1"
            echo "  $2: $len bytes, $mod"
          }

          echo "deposited:"
          probe sources.tsv kb.ttl.gz "$BASE/out/kb.ttl.gz"
          probe sources.tsv fbbt.owl  "$BASE/out/fbbt.owl"
          probe sources.tsv seed.txt  "$BASE/out/seed.txt"
          echo "served (recorded, not deposited):"
          probe served.tsv  owlery-live.owl   "$OWL_LIVE_URL"
          probe served.tsv  VFB-PDB-v4.tar.gz "$PDB_LIVE_URL"

          # 1. everything must predate the release
          if [ -n "${RELEASED_AT:-}" ]; then
            rel=$(date -u -d "$RELEASED_AT" +%s); fail=0
            while IFS=$'\t' read -r n u l m; do
              [ "$(date -u -d "$m" +%s)" -le "$rel" ] || {
                echo "::error::$n was modified at $m, after the release was published at $RELEASED_AT — the pipeline moved mid-run."; fail=1; }
            done < <(cat sources.tsv served.tsv)
            [ "$fail" -eq 0 ] || exit 1
            echo "all sources predate the release"
          else
            echo "::notice::Manual run — skipping the predates-the-release check."
          fi

          # 2. the build products and the served graph should be the same generation
          bm=$(date -u -d "$(awk -F'\t' '$1=="kb.ttl.gz"{print $4}' sources.tsv)" +%s)
          sm=$(date -u -d "$(awk -F'\t' '$1=="owlery-live.owl"{print $4}' served.tsv)" +%s)
          gap=$(( (bm - sm) / 86400 )); gap=${gap#-}
          if [ "$gap" -gt 2 ]; then
            echo "::warning::out/kb.ttl.gz and the served owlery-live.owl are $gap days apart."
            echo "::warning::out/ holds the latest BUILD; cutting a release is what promotes it. If a build has not been promoted, this deposit describes a different generation from the one being served — check before relying on it."
          else
            echo "build products and served graph agree to within $gap day(s)"
          fi

      - name: Open a Zenodo version
        if: ${{ !inputs.dry_run }}
        id: dep
        env:
          TOKEN: ${{ secrets.ZENODO_TOKEN }}
          CONCEPT: ${{ vars.ZENODO_CONCEPT }}
        run: |
          set -euo pipefail
          [ -n "${TOKEN:-}" ] || { echo "::error::ZENODO_TOKEN is not set"; exit 1; }
          if [ -n "${CONCEPT:-}" ]; then
            echo "Creating a new version of record $CONCEPT"
            resp=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
                   "$ZENODO_API/deposit/depositions/$CONCEPT/actions/newversion")
            resp=$(curl -sf -H "Authorization: Bearer $TOKEN" "$(printf '%s' "$resp" | jq -r '.links.latest_draft')")
          else
            echo "No ZENODO_CONCEPT set — creating a brand new record"
            resp=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
                   -H "Content-Type: application/json" -d '{}' "$ZENODO_API/deposit/depositions")
          fi
          echo "id=$(printf '%s' "$resp" | jq -r '.id')"          >> "$GITHUB_OUTPUT"
          echo "bucket=$(printf '%s' "$resp" | jq -r '.links.bucket')" >> "$GITHUB_OUTPUT"

      - name: Fetch, checksum and upload
        env:
          TOKEN: ${{ secrets.ZENODO_TOKEN }}
          BUCKET: ${{ steps.dep.outputs.bucket }}
          TAG: ${{ steps.tag.outputs.tag }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "Virtual Fly Brain knowledge graph — release $TAG"
            echo "captured $(date -u +%Y-%m-%dT%H:%M:%SZ) by ${{ github.workflow }} run ${{ github.run_id }}"
            echo "source repo commit ${{ github.sha }}"
            echo
            echo "The release tag is the date the release was cut. The dates below are when"
            echo "each file was published, which is what this deposit describes."
            echo
            echo "== deposited =="
          } > manifest.txt

          while IFS=$'\t' read -r name url len mod; do
            echo "::group::$name"
            curl -fL --retry 5 --retry-delay 10 --retry-all-errors --max-time 3600 -o "$name" "$url"
            got=$(stat -c%s "$name")
            [ "$got" = "$len" ] || { echo "::error::$name is $got bytes, server advertised $len — truncated or rotated mid-download."; exit 1; }
            {
              echo "$name"
              echo "    sha256     $(sha256sum "$name" | cut -d' ' -f1)"
              echo "    size       $got bytes"
              echo "    published  $mod"
              echo "    source     $url"
            } >> manifest.txt
            if [ "${DRY:-false}" = "true" ]; then
              echo "dry run — not uploading $name"
            else
              curl -fT "$name" "$BUCKET/$name?access_token=$TOKEN" -o /dev/null --retry 3 --retry-delay 30 --max-time 3600
              echo "uploaded $name"
            fi
            rm -f "$name"
            echo "::endgroup::"
          done < sources.tsv

          {
            echo
            echo "== served at this release, not deposited =="
            echo "The Neo4j production database is a binary store that cannot be read without"
            echo "a matching Neo4j binary, and owlery-live.owl is a 6.6 GB rendering of the same"
            echo "content deposited above as kb.ttl.gz. Both are kept on VFB's archive and linked"
            echo "from the GitHub release; they are identified here so the deposit records exactly"
            echo "what this release served."
            echo
            while IFS=$'\t' read -r name url len mod; do
              printf '%s\n    size       %s bytes\n    published  %s\n    source     %s\n' "$name" "$len" "$mod" "$url"
            done < served.tsv
          } >> manifest.txt

          echo "::group::manifest"; cat manifest.txt; echo "::endgroup::"
          [ "${DRY:-false}" = "true" ] || curl -fT manifest.txt "$BUCKET/manifest.txt?access_token=$TOKEN" -o /dev/null

      - name: Describe and publish the deposit
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ID: ${{ steps.dep.outputs.id }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          DESC="<p>The Virtual Fly Brain knowledge graph as released at <code>$TAG</code>.</p>
          <p>Contains the graph as Turtle (<code>kb.ttl.gz</code>), the exact version of the
          <em>Drosophila</em> Anatomy Ontology it was built against (<code>fbbt.owl</code>), and the
          build seed that pins the result (<code>seed.txt</code>), with SHA-256 checksums for each.
          Together these make the release reproducible rather than merely retained.</p>
          <p>The Neo4j production database and <code>owlery-live.owl</code> served by this release are
          identified in <code>manifest.txt</code> by URL, size and publication date; both are
          derivations of the same triplestore content deposited here.</p>"
          jq -n --arg t "Virtual Fly Brain knowledge graph $TAG" --arg d "$DESC" --arg v "$TAG" \
            '{metadata:{title:$t, upload_type:"dataset", description:$d, version:$v,
              license:"cc-by-4.0", access_right:"open",
              creators:[{name:"Court, Robert", affiliation:"University of Edinburgh",
                         orcid:"0000-0002-0173-9080"}],
              keywords:["Drosophila melanogaster","knowledge graph","ontology","OWL","RDF",
                        "Virtual Fly Brain","neuroanatomy","connectomics"],
              related_identifiers:[
                {identifier:"10.3389/fphys.2023.1076533", relation:"isSupplementTo", scheme:"doi"}]}}' \
            > meta.json
          curl -sf -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
               -d @meta.json "$ZENODO_API/deposit/depositions/$ID" -o /dev/null
          pub=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
                "$ZENODO_API/deposit/depositions/$ID/actions/publish")
          {
            echo "### Archived to Zenodo"
            echo "- version DOI: \`$(printf '%s' "$pub" | jq -r '.doi')\`"
            echo "- concept id: \`$(printf '%s' "$pub" | jq -r '.conceptrecid')\` — set this as the repository variable \`ZENODO_CONCEPT\` if it is not already"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the manifest to the GitHub release
        if: ${{ !inputs.dry_run && github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" manifest.txt --clobber
