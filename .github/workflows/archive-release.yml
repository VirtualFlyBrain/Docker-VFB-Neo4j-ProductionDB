name: Archive release to Zenodo

# When a release is published here, capture the knowledge graph exactly as it is
# being served at that moment and deposit it to Zenodo with a DOI.
#
# This removes the guesswork in the historical record. Until now the only dated
# copies were the `previous-*` files in the Jenkins workspace, which are stamped
# with the date they were DISPLACED, not the date their content went live — so
# reconstructing which graph belongs to which release means reasoning backwards
# through the rotation. From this release onward the mapping is recorded at the
# moment it is true.
#
# Sources (as used by the images this release builds):
#   PDB  http://data.virtualflybrain.org/archive/VFB-PDB-v4.tar.gz
#        — the file loadDB.sh fetches (BACKUPFILE=VFB-PDB-v4), ~5.6 GB
#   OWL  http://VirtualFlyBrain.org/data/VFB/OWL/owlery-live.owl
#        — OWLURL in owlery-vfb:timeout, ~6.6 GB
#
# Requires:
#   secrets.ZENODO_TOKEN   Zenodo personal access token, scopes: deposit:write deposit:actions
#   vars.ZENODO_CONCEPT    (optional) numeric id of an existing Zenodo record.
#                          Leave unset for the first run; the run prints the id to set.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to archive (defaults to the latest release)"
        required: false
      dry_run:
        description: "Download and checksum only — deposit nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PDB_URL: http://data.virtualflybrain.org/archive/VFB-PDB-v4.tar.gz
      OWL_URL: http://VirtualFlyBrain.org/data/VFB/OWL/owlery-live.owl
      ZENODO_API: https://zenodo.org/api

    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo untagged)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Archiving graph as at release $TAG"

      - name: Check there is room
        run: |
          df -h /
          FREE=$(df --output=avail -k / | tail -1)
          # need ~7 GB headroom: files are handled one at a time and deleted after upload
          if [ "$FREE" -lt 8000000 ]; then
            echo "::warning::Less than 8 GB free — a standard runner may not fit the OWL file."
          fi

      - name: Record what is being archived
        id: probe
        run: |
          set -euo pipefail
          for pair in "PDB:$PDB_URL" "OWL:$OWL_URL"; do
            key="${pair%%:*}"; url="${pair#*:}"
            hdr=$(curl -sIL --max-time 60 "$url")
            len=$(printf '%s' "$hdr" | grep -i '^content-length:' | tail -1 | tr -dc '0-9')
            mod=$(printf '%s' "$hdr" | grep -i '^last-modified:' | tail -1 | cut -d' ' -f2-)
            echo "${key}_len=$len"  >> "$GITHUB_OUTPUT"
            echo "${key}_mod=$mod"  >> "$GITHUB_OUTPUT"
            echo "$key: $len bytes, last modified $mod"
          done

      - name: Open a Zenodo version
        if: ${{ !inputs.dry_run }}
        id: dep
        env:
          TOKEN: ${{ secrets.ZENODO_TOKEN }}
          CONCEPT: ${{ vars.ZENODO_CONCEPT }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::ZENODO_TOKEN is not set"; exit 1
          fi
          if [ -n "${CONCEPT:-}" ]; then
            echo "Creating a new version of record $CONCEPT"
            resp=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
                   "$ZENODO_API/deposit/depositions/$CONCEPT/actions/newversion")
            latest=$(printf '%s' "$resp" | jq -r '.links.latest_draft')
            resp=$(curl -sf -H "Authorization: Bearer $TOKEN" "$latest")
          else
            echo "No ZENODO_CONCEPT set — creating a brand new record"
            resp=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
                   -H "Content-Type: application/json" -d '{}' \
                   "$ZENODO_API/deposit/depositions")
          fi
          id=$(printf '%s' "$resp" | jq -r '.id')
          bucket=$(printf '%s' "$resp" | jq -r '.links.bucket')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "Deposition $id"

      - name: Fetch, checksum and upload each file
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.ZENODO_TOKEN }}
          BUCKET: ${{ steps.dep.outputs.bucket }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          : > manifest.txt
          {
            echo "Virtual Fly Brain knowledge graph — release $TAG"
            echo "captured $(date -u +%Y-%m-%dT%H:%M:%SZ) by ${{ github.workflow }} run ${{ github.run_id }}"
            echo "source repo commit ${{ github.sha }}"
            echo
          } >> manifest.txt
          # one at a time so peak disk stays near the size of the larger file
          for pair in "VFB-PDB-v4.tar.gz:$PDB_URL" "owlery-live.owl:$OWL_URL"; do
            name="${pair%%:*}"; url="${pair#*:}"
            echo "::group::$name"
            curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
                 --max-time 7200 -o "$name" "$url"
            sum=$(sha256sum "$name" | cut -d' ' -f1)
            size=$(stat -c%s "$name")
            printf '%s  %s  %s bytes  from %s\n' "$sum" "$name" "$size" "$url" >> manifest.txt
            curl -fT "$name" "$BUCKET/$name?access_token=$TOKEN" -o /dev/null \
              --retry 3 --retry-delay 30 --max-time 7200
            rm -f "$name"
            echo "uploaded and removed $name"
            echo "::endgroup::"
          done
          curl -fT manifest.txt "$BUCKET/manifest.txt?access_token=$TOKEN" -o /dev/null

      - name: Describe and publish the deposit
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ID: ${{ steps.dep.outputs.id }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          DESC="<p>The Virtual Fly Brain knowledge graph as served at release <code>$TAG</code>.</p>
          <p>Contains the Neo4j production database backup (<code>VFB-PDB-v4.tar.gz</code>, the file
          restored by <code>loadDB.sh</code> in <code>virtualflybrain/docker-vfb-neo4j-productiondb:$TAG</code>)
          and the reasoner-ready OWL (<code>owlery-live.owl</code>, the file loaded by
          <code>virtualflybrain/owlery-vfb</code>), together with SHA-256 checksums for both.</p>
          <p>Captured directly from the public endpoints at the moment the release was published, so the
          deposit is the graph that release actually served.</p>"
          jq -n --arg t "Virtual Fly Brain knowledge graph $TAG" --arg d "$DESC" --arg v "$TAG" \
            '{metadata:{title:$t, upload_type:"dataset", description:$d, version:$v,
              license:"cc-by-4.0", access_right:"open",
              creators:[{name:"Court, Robert", affiliation:"University of Edinburgh",
                         orcid:"0000-0002-0173-9080"}],
              keywords:["Drosophila melanogaster","knowledge graph","Neo4j","OWL",
                        "Virtual Fly Brain","neuroanatomy","connectomics"],
              related_identifiers:[
                {identifier:"10.3389/fphys.2023.1076533", relation:"isSupplementTo", scheme:"doi"}]}}' \
            > meta.json
          curl -sf -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
               -d @meta.json "$ZENODO_API/deposit/depositions/$ID" -o /dev/null
          pub=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
                "$ZENODO_API/deposit/depositions/$ID/actions/publish")
          doi=$(printf '%s' "$pub" | jq -r '.doi')
          concept=$(printf '%s' "$pub" | jq -r '.conceptrecid')
          echo "DOI: $doi"
          {
            echo "### Archived to Zenodo"
            echo "- version DOI: \`$doi\`"
            echo "- concept id: \`$concept\` — set this as the repository variable \`ZENODO_CONCEPT\` if it is not already"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the manifest to the GitHub release
        if: ${{ !inputs.dry_run && github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the data files themselves exceed GitHub's 2 GB per-asset limit, so only
          # the checksum manifest is attached here; the data lives in Zenodo
          gh release upload "${{ steps.tag.outputs.tag }}" manifest.txt --clobber
