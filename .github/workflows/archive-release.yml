name: Archive release to Zenodo

# When a release is published here, deposit that release's knowledge graph to
# Zenodo with a DOI, as a new version of one long-lived record.
#
# ---------------------------------------------------------------------------
# IT READS ONLY THE RELEASE-NAMED ARCHIVE, NEVER THE LIVE PATHS
#
# /data/VFB/OWL/ and /data/VFB/OWL/out/ are working directories. Partial pipeline
# deployments run between releases and overwrite them in place, so a file fetched
# from there is whatever the pipeline last wrote — not what this release serves.
# Reading them would silently deposit the wrong generation of the graph under a
# release tag, which is exactly the confusion this job exists to end.
#
# So the job fetches only immutable, release-named copies:
#
#   <ARCHIVE_BASE>/VFB-PDB-v<release>.tar.gz     the Neo4j production database
#   <ARCHIVE_BASE>/VFB-OWL-v<release>.owl.gz     the reasoner input
#                  (falls back to .owl if the uncompressed name is used)
#
# where <release> is the tag with its leading "v" removed, so v26.08.16 gives
# VFB-PDB-v26.08.16.tar.gz.
#
# THIS REQUIRES A JENKINS STEP. At release time the pipeline must copy the
# promoted PDB and OWL to the archive under those names. Until that exists, the
# job fails with a clear message rather than falling back to a live path — a
# loud failure is worth far more than a deposit that is quietly wrong.
#
# WHY BOTH FILES, WHOLE. The production database cannot be rebuilt from the OWL
# dumps: pdb.owl is only part of what ends up in the graph, since the connectome,
# region-connectivity, scRNAseq and EPseq edges are side-loaded into Neo4j from
# separate CSVs, with further post-processing after that.
#
# Anything not already gzip is gzipped before upload — measured on the live OWL
# that is 37.0x (6,632,943,902 -> 179,411,457 B). The manifest records the SHA-256
# of each file as fetched, before compression, so
#   gunzip -c <file> | sha256sum
# reproduces it.
#
# Requires:
#   secrets.ZENODO_TOKEN   Zenodo personal access token, scopes deposit:write deposit:actions
#   vars.ZENODO_CONCEPT    (optional) numeric id of an existing Zenodo record.
#                          Leave unset for the first run; the run prints the id to set.
#   vars.ARCHIVE_BASE      (optional) override the archive URL below.
# ---------------------------------------------------------------------------

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to archive (defaults to the latest release)"
        required: false
      dry_run:
        description: "Download, checksum and print the manifest — deposit nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    # Peak disk is the largest single file plus its gzip; files are handled one
    # at a time and deleted after upload.
    timeout-minutes: 240
    env:
      ZENODO_API: https://zenodo.org/api

    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo untagged)"
          echo "tag=$TAG"    >> "$GITHUB_OUTPUT"
          echo "rel=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Archiving release $TAG"

      - name: Check there is room
        run: |
          df -h /
          FREE=$(df --output=avail -k / | tail -1)
          [ "$FREE" -ge 9000000 ] || echo "::warning::Less than 9 GB free on the runner."

      - name: Locate this release's files on the archive
        id: probe
        env:
          REL: ${{ steps.tag.outputs.rel }}
          BASE: ${{ vars.ARCHIVE_BASE || 'http://data.virtualflybrain.org/archive' }}
        run: |
          set -euo pipefail
          : > sources.tsv   # name <TAB> url <TAB> bytes <TAB> last-modified
          missing=0

          find_one() {   # label, candidate URLs...
            label="$1"; shift
            for url in "$@"; do
              hdr=$(curl -sIL --max-time 120 "$url" || true)
              code=$(printf '%s' "$hdr" | awk '/^HTTP/{c=$2} END{print c}')
              [ "$code" = "200" ] || { echo "  $label: not at $url (HTTP ${code:-none})"; continue; }
              len=$(printf '%s' "$hdr" | grep -i '^content-length:' | tail -1 | tr -dc '0-9')
              mod=$(printf '%s' "$hdr" | grep -i '^last-modified:'  | tail -1 | cut -d' ' -f2- | tr -d '\r')
              [ -n "$len" ] || { echo "::error::$url returned 200 but no Content-Length"; exit 1; }
              printf '%s\t%s\t%s\t%s\n' "$(basename "$url")" "$url" "$len" "${mod:-unknown}" >> sources.tsv
              echo "  $label: $(basename "$url") — $len bytes, ${mod:-no Last-Modified}"
              return 0
            done
            return 1
          }

          find_one PDB "$BASE/VFB-PDB-v${REL}.tar.gz" || missing=1
          find_one OWL "$BASE/VFB-OWL-v${REL}.owl.gz" "$BASE/VFB-OWL-v${REL}.owl" || missing=1

          if [ "$missing" -ne 0 ]; then
            echo "::error::This release's files are not on the archive yet."
            echo "::error::Expected $BASE/VFB-PDB-v${REL}.tar.gz and $BASE/VFB-OWL-v${REL}.owl.gz"
            echo "::error::Publish the release-named copies from the pipeline first, then re-run this job."
            echo "::error::Deliberately not falling back to the live /data/VFB/OWL paths: partial pipeline"
            echo "::error::deployments overwrite those between releases, so they are not this release's graph."
            exit 1
          fi
          echo "both files present on the archive"

      - name: Open a Zenodo version
        if: ${{ !inputs.dry_run }}
        id: dep
        env:
          TOKEN: ${{ secrets.ZENODO_TOKEN }}
          CONCEPT: ${{ vars.ZENODO_CONCEPT }}
        run: |
          set -euo pipefail
          [ -n "${TOKEN:-}" ] || { echo "::error::ZENODO_TOKEN is not set"; exit 1; }
          if [ -n "${CONCEPT:-}" ]; then
            echo "Creating a new version of record $CONCEPT"
            resp=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
                   "$ZENODO_API/deposit/depositions/$CONCEPT/actions/newversion")
            resp=$(curl -sf -H "Authorization: Bearer $TOKEN" "$(printf '%s' "$resp" | jq -r '.links.latest_draft')")
            id=$(printf '%s' "$resp" | jq -r '.id')
            # a new version inherits the previous version's files — clear them
            for fid in $(printf '%s' "$resp" | jq -r '.files[]?.id'); do
              curl -sf -X DELETE -H "Authorization: Bearer $TOKEN" \
                   "$ZENODO_API/deposit/depositions/$id/files/$fid" -o /dev/null
            done
          else
            echo "No ZENODO_CONCEPT set — creating a brand new record"
            resp=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
                   -H "Content-Type: application/json" -d '{}' "$ZENODO_API/deposit/depositions")
            id=$(printf '%s' "$resp" | jq -r '.id')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "bucket=$(printf '%s' "$resp" | jq -r '.links.bucket')" >> "$GITHUB_OUTPUT"
          echo "Deposition $id"

      - name: Fetch, checksum and upload
        env:
          TOKEN: ${{ secrets.ZENODO_TOKEN }}
          BUCKET: ${{ steps.dep.outputs.bucket }}
          TAG: ${{ steps.tag.outputs.tag }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "Virtual Fly Brain knowledge graph — release $TAG"
            echo "captured $(date -u +%Y-%m-%dT%H:%M:%SZ) by ${{ github.workflow }} run ${{ github.run_id }}"
            echo "source repo commit ${{ github.sha }}"
            echo
            echo "Taken from the release-named copies on VFB's archive, never from the live"
            echo "/data/VFB/OWL paths, which partial pipeline deployments overwrite between"
            echo "releases. sha256 is of the file as fetched, before any compression applied"
            echo "here; where a .gz was produced, gunzip -c <file> | sha256sum reproduces it."
            echo
          } > manifest.txt

          # one at a time, so peak disk stays near the size of the largest file
          while IFS=$'\t' read -r name url len mod; do
            echo "::group::$name"
            curl -fL --retry 5 --retry-delay 10 --retry-all-errors --max-time 7200 -o "$name" "$url"
            got=$(stat -c%s "$name")
            [ "$got" = "$len" ] || { echo "::error::$name is $got bytes, server advertised $len — truncated."; exit 1; }
            sum=$(sha256sum "$name" | cut -d' ' -f1)

            upload="$name"
            if [ "$(od -An -N2 -tx1 "$name" | tr -d ' \n')" != "1f8b" ]; then
              gzip -6 "$name"; upload="$name.gz"
              echo "gzipped $name -> $(stat -c%s "$upload") bytes"
            fi

            {
              echo "$name"
              echo "    sha256     $sum"
              echo "    size       $got bytes"
              echo "    published  $mod"
              echo "    source     $url"
              echo "    deposited  $upload ($(stat -c%s "$upload") bytes)"
            } >> manifest.txt

            if [ "${DRY:-false}" = "true" ]; then
              echo "dry run — not uploading $upload"
            else
              curl -fT "$upload" -H "Authorization: Bearer $TOKEN" "$BUCKET/$upload" \
                -o /dev/null --retry 3 --retry-delay 30 --max-time 7200
              echo "uploaded $upload"
            fi
            rm -f "$name" "$upload"
            echo "::endgroup::"
          done < sources.tsv

          {
            echo
            echo "The Neo4j production database is deposited whole because it cannot be rebuilt"
            echo "from the OWL: pdb.owl is only part of what the graph contains — the connectome,"
            echo "region-connectivity, scRNAseq and EPseq edges are side-loaded into Neo4j from"
            echo "separate CSVs, with further post-processing after that."
          } >> manifest.txt

          echo "::group::manifest"; cat manifest.txt; echo "::endgroup::"
          [ "${DRY:-false}" = "true" ] || curl -fT manifest.txt -H "Authorization: Bearer $TOKEN" \
            "$BUCKET/manifest.txt" -o /dev/null

      - name: Describe and publish the deposit
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ID: ${{ steps.dep.outputs.id }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          DESC="<p>The Virtual Fly Brain knowledge graph as released at <code>$TAG</code>.</p>
          <p>Contains the two files that constitute a VFB release: the Neo4j production database
          (<code>VFB-PDB-v${TAG#v}.tar.gz</code>, the backup restored by <code>loadDB.sh</code> in
          <code>virtualflybrain/docker-vfb-neo4j-productiondb:$TAG</code>) and the reasoner input
          (<code>VFB-OWL-v${TAG#v}.owl.gz</code>, loaded by <code>virtualflybrain/owlery-vfb</code>).
          SHA-256 checksums are in <code>manifest.txt</code>.</p>
          <p>The production database is deposited whole rather than as OWL because it cannot be
          rebuilt from the OWL dumps: the connectome, region-connectivity, scRNAseq and EPseq edges
          are side-loaded into Neo4j from separate CSVs, with further post-processing after that.</p>
          <p>Taken from the release-named copies on VFB's archive rather than the live working
          directories, so the deposit is this release's graph and not whatever a later partial
          pipeline run happened to leave in place.</p>"
          jq -n --arg t "Virtual Fly Brain knowledge graph $TAG" --arg d "$DESC" --arg v "$TAG" \
            '{metadata:{title:$t, upload_type:"dataset", description:$d, version:$v,
              license:"cc-by-4.0", access_right:"open",
              creators:[{name:"Court, Robert", affiliation:"University of Edinburgh",
                         orcid:"0000-0002-0173-9080"}],
              keywords:["Drosophila melanogaster","knowledge graph","Neo4j","OWL",
                        "Virtual Fly Brain","neuroanatomy","connectomics"],
              related_identifiers:[
                {identifier:"10.3389/fphys.2023.1076533", relation:"isSupplementTo", scheme:"doi"}]}}' \
            > meta.json
          curl -sf -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
               -d @meta.json "$ZENODO_API/deposit/depositions/$ID" -o /dev/null
          pub=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
                "$ZENODO_API/deposit/depositions/$ID/actions/publish")
          {
            echo "### Archived to Zenodo"
            echo "- version DOI: \`$(printf '%s' "$pub" | jq -r '.doi')\`"
            echo "- concept id: \`$(printf '%s' "$pub" | jq -r '.conceptrecid')\` — set this as the repository variable \`ZENODO_CONCEPT\` if it is not already"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the manifest to the GitHub release
        if: ${{ !inputs.dry_run && github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" manifest.txt --clobber
