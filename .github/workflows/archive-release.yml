name: Archive release to Zenodo

# When a release is published here, deposit the knowledge graph to Zenodo with a
# DOI, as a new version of one long-lived record.
#
# How this is meant to be used:
#   1. Jenkins builds and promotes the PDB and OWL to the public paths.
#   2. Once both are live, cut a release here, tagged with that day's date.
#   3. This job takes whatever is latest at those paths and deposits it.
#
# So the release tag says WHEN the release was cut, and the deposit says WHAT
# was in it. Until now the only dated copies were the `previous-*` files in the
# Jenkins workspace, stamped with the date they were DISPLACED rather than the
# date their content went live, so working out which graph belonged to which
# release meant reasoning backwards through the rotation.
#
# ---------------------------------------------------------------------------
# WHAT IS DEPOSITED — the two files that constitute a VFB release, taken from
# the live locations at the moment the release is published:
#
#   http://data.virtualflybrain.org/archive/VFB-PDB-v4.tar.gz   ~5.6 GB
#       the Neo4j production database, the backup loadDB.sh restores
#   http://VirtualFlyBrain.org/data/VFB/OWL/owlery-live.owl     ~6.6 GB
#       the reasoner input loaded by owlery-vfb
#
# These two are the promoted release artefacts. Nothing else under
# /data/VFB/OWL/ is — `out/`, `raw/` and the working files there are overwritten
# by partial pipeline deployments between releases, so they are build state, not
# release state, and this job must never read them.
#
# Cutting the release is the LAST step: the PDB and OWL are already promoted and
# settled before the tag exists, so when this job runs on `release: published`
# those two paths hold this release by construction. There is no race to win.
#
# The predates-the-release check below is therefore not guarding the normal case.
# It is an assertion that the normal case held — a file dated after the release
# means something was promoted out of order, or a later pipeline run overtook the
# job, and the deposit would be a different graph from the one released. Cheap to
# check, and it turns a silent wrong answer into a failed run.
#
# Both go in whole. The production database in particular CANNOT be rebuilt from
# the OWL dumps: pdb.owl is only part of what ends up in the graph — the
# connectome, region-connectivity, scRNAseq and EPseq edges are side-loaded into
# Neo4j from separate CSVs, with further post-processing after that.
#
# owlery-live.owl is gzipped before upload. Measured on the live file that is
# 37.0x (6,632,943,902 -> 179,411,457 B), so the deposit costs ~5.8 GB rather
# than 12.2 GB. The manifest records the SHA-256 of the file as served, taken
# before compression, so `gunzip -c owlery-live.owl.gz | sha256sum` reproduces it.
# The PDB tarball is already gzip and is deposited unchanged.
#
# The job fails if either file is newer than the release, which would mean the
# pipeline rotated mid-run and the deposit would not be the graph the release
# was cut for.
#
# Requires:
#   secrets.ZENODO_TOKEN   Zenodo personal access token, scopes deposit:write deposit:actions
#   vars.ZENODO_CONCEPT    (optional) numeric id of an existing Zenodo record.
#                          Leave unset for the first run; the run prints the id to set.
# ---------------------------------------------------------------------------

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to archive (defaults to the latest release)"
        required: false
      dry_run:
        description: "Download, checksum and print the manifest — deposit nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    # 12.2 GB down, ~5.8 GB up. Peak disk is owlery-live.owl plus its gzip,
    # ~6.8 GB; files are handled one at a time and deleted after upload.
    timeout-minutes: 240
    env:
      OWL_URL: http://VirtualFlyBrain.org/data/VFB/OWL/owlery-live.owl
      PDB_URL: http://data.virtualflybrain.org/archive/VFB-PDB-v4.tar.gz
      ZENODO_API: https://zenodo.org/api

    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo untagged)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Archiving graph as at release $TAG"

      - name: Check there is room
        run: |
          df -h /
          FREE=$(df --output=avail -k / | tail -1)
          [ "$FREE" -ge 9000000 ] || echo "::warning::Less than 9 GB free — owlery-live.owl plus its gzip may not fit."

      - name: Probe the sources and check they predate the release
        id: probe
        env:
          RELEASED_AT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail
          : > sources.tsv   # name <TAB> url <TAB> bytes <TAB> last-modified
          for pair in "VFB-PDB-v4.tar.gz|$PDB_URL" "owlery-live.owl|$OWL_URL"; do
            name="${pair%%|*}"; url="${pair#*|}"
            hdr=$(curl -sIL --max-time 120 "$url")
            len=$(printf '%s' "$hdr" | grep -i '^content-length:' | tail -1 | tr -dc '0-9')
            mod=$(printf '%s' "$hdr" | grep -i '^last-modified:'  | tail -1 | cut -d' ' -f2- | tr -d '\r')
            [ -n "$len" ] && [ -n "$mod" ] || { echo "::error::$url gave no Content-Length/Last-Modified"; exit 1; }
            printf '%s\t%s\t%s\t%s\n' "$name" "$url" "$len" "$mod" >> sources.tsv
            echo "$name: $len bytes, last modified $mod"
          done

          if [ -n "${RELEASED_AT:-}" ]; then
            rel=$(date -u -d "$RELEASED_AT" +%s); fail=0
            while IFS=$'\t' read -r n u l m; do
              f=$(date -u -d "$m" +%s)
              if [ "$f" -gt "$rel" ]; then
                echo "::error::$n was modified at $m, after the release was published at $RELEASED_AT."
                echo "::error::The pipeline rotated mid-run; this deposit would not be the graph this release was cut for."
                fail=1
              else
                echo "$n predates the release by $(( (rel - f) / 86400 )) day(s) — OK"
              fi
            done < sources.tsv
            [ "$fail" -eq 0 ] || exit 1
          else
            echo "::notice::Manual run — skipping the predates-the-release check."
          fi

          # The two files are promoted together, so a large gap between them means
          # only one half of the release went live.
          a=$(date -u -d "$(awk -F'\t' 'NR==1{print $4}' sources.tsv)" +%s)
          b=$(date -u -d "$(awk -F'\t' 'NR==2{print $4}' sources.tsv)" +%s)
          gap=$(( a - b )); gap=${gap#-}
          [ "$gap" -le 86400 ] || echo "::warning::the PDB and OWL are $(( gap / 86400 )) days apart — are both halves of this release live?"

      - name: Open a Zenodo version
        if: ${{ !inputs.dry_run }}
        id: dep
        env:
          TOKEN: ${{ secrets.ZENODO_TOKEN }}
          CONCEPT: ${{ vars.ZENODO_CONCEPT }}
        run: |
          set -euo pipefail
          [ -n "${TOKEN:-}" ] || { echo "::error::ZENODO_TOKEN is not set"; exit 1; }
          if [ -n "${CONCEPT:-}" ]; then
            echo "Creating a new version of record $CONCEPT"
            resp=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
                   "$ZENODO_API/deposit/depositions/$CONCEPT/actions/newversion")
            resp=$(curl -sf -H "Authorization: Bearer $TOKEN" "$(printf '%s' "$resp" | jq -r '.links.latest_draft')")
            id=$(printf '%s' "$resp" | jq -r '.id')
            # a new version inherits the previous version's files — clear them
            for fid in $(printf '%s' "$resp" | jq -r '.files[]?.id'); do
              curl -sf -X DELETE -H "Authorization: Bearer $TOKEN" \
                   "$ZENODO_API/deposit/depositions/$id/files/$fid" -o /dev/null
            done
          else
            echo "No ZENODO_CONCEPT set — creating a brand new record"
            resp=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
                   -H "Content-Type: application/json" -d '{}' "$ZENODO_API/deposit/depositions")
            id=$(printf '%s' "$resp" | jq -r '.id')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "bucket=$(printf '%s' "$resp" | jq -r '.links.bucket')" >> "$GITHUB_OUTPUT"
          echo "Deposition $id"

      - name: Fetch, checksum and upload
        env:
          TOKEN: ${{ secrets.ZENODO_TOKEN }}
          BUCKET: ${{ steps.dep.outputs.bucket }}
          TAG: ${{ steps.tag.outputs.tag }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "Virtual Fly Brain knowledge graph — release $TAG"
            echo "captured $(date -u +%Y-%m-%dT%H:%M:%SZ) by ${{ github.workflow }} run ${{ github.run_id }}"
            echo "source repo commit ${{ github.sha }}"
            echo
            echo "The release tag is the date the release was cut. The dates below are when"
            echo "each file was published, which is what this deposit contains."
            echo
            echo "sha256 is of the file as served, before any compression. Where a .gz is"
            echo "deposited, gunzip -c <file> | sha256sum reproduces it."
            echo
          } > manifest.txt

          # one at a time, so peak disk stays near the size of the largest file
          while IFS=$'\t' read -r name url len mod; do
            echo "::group::$name"
            curl -fL --retry 5 --retry-delay 10 --retry-all-errors --max-time 7200 -o "$name" "$url"
            got=$(stat -c%s "$name")
            [ "$got" = "$len" ] || { echo "::error::$name is $got bytes, server advertised $len — truncated or rotated mid-download."; exit 1; }
            sum=$(sha256sum "$name" | cut -d' ' -f1)

            upload="$name"
            if [ "$(od -An -N2 -tx1 "$name" | tr -d ' \n')" != "1f8b" ]; then
              gzip -6 "$name"; upload="$name.gz"
              echo "gzipped $name -> $(stat -c%s "$upload") bytes"
            fi

            {
              echo "$name"
              echo "    sha256     $sum"
              echo "    size       $got bytes"
              echo "    published  $mod"
              echo "    source     $url"
              echo "    deposited  $upload ($(stat -c%s "$upload") bytes)"
            } >> manifest.txt

            if [ "${DRY:-false}" = "true" ]; then
              echo "dry run — not uploading $upload"
            else
              curl -fT "$upload" -H "Authorization: Bearer $TOKEN" "$BUCKET/$upload" \
                -o /dev/null --retry 3 --retry-delay 30 --max-time 7200
              echo "uploaded $upload"
            fi
            rm -f "$name" "$upload"
            echo "::endgroup::"
          done < sources.tsv

          {
            echo
            echo "The Neo4j production database is deposited whole because it cannot be rebuilt"
            echo "from the OWL: pdb.owl is only part of what the graph contains — the connectome,"
            echo "region-connectivity, scRNAseq and EPseq edges are side-loaded into Neo4j from"
            echo "separate CSVs, with further post-processing after that."
          } >> manifest.txt

          echo "::group::manifest"; cat manifest.txt; echo "::endgroup::"
          [ "${DRY:-false}" = "true" ] || curl -fT manifest.txt -H "Authorization: Bearer $TOKEN" \
            "$BUCKET/manifest.txt" -o /dev/null

      - name: Describe and publish the deposit
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ID: ${{ steps.dep.outputs.id }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          DESC="<p>The Virtual Fly Brain knowledge graph as served at release <code>$TAG</code>.</p>
          <p>Contains the two files that constitute a VFB release: the Neo4j production database
          (<code>VFB-PDB-v4.tar.gz</code>, the backup restored by <code>loadDB.sh</code> in
          <code>virtualflybrain/docker-vfb-neo4j-productiondb:$TAG</code>) and the reasoner input
          (<code>owlery-live.owl</code>, loaded by <code>virtualflybrain/owlery-vfb</code>, deposited
          gzipped). SHA-256 checksums of both files as served are in <code>manifest.txt</code>.</p>
          <p>The production database is deposited whole rather than as OWL because it cannot be
          rebuilt from the OWL dumps: the connectome, region-connectivity, scRNAseq and EPseq edges
          are side-loaded into Neo4j from separate CSVs, with further post-processing after that.</p>
          <p>Captured from the public endpoints at the moment the release was published, so the
          deposit is the graph that release actually served.</p>"
          jq -n --arg t "Virtual Fly Brain knowledge graph $TAG" --arg d "$DESC" --arg v "$TAG" \
            '{metadata:{title:$t, upload_type:"dataset", description:$d, version:$v,
              license:"cc-by-4.0", access_right:"open",
              creators:[{name:"Court, Robert", affiliation:"University of Edinburgh",
                         orcid:"0000-0002-0173-9080"}],
              keywords:["Drosophila melanogaster","knowledge graph","Neo4j","OWL",
                        "Virtual Fly Brain","neuroanatomy","connectomics"],
              related_identifiers:[
                {identifier:"10.3389/fphys.2023.1076533", relation:"isSupplementTo", scheme:"doi"}]}}' \
            > meta.json
          curl -sf -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
               -d @meta.json "$ZENODO_API/deposit/depositions/$ID" -o /dev/null
          pub=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
                "$ZENODO_API/deposit/depositions/$ID/actions/publish")
          {
            echo "### Archived to Zenodo"
            echo "- version DOI: \`$(printf '%s' "$pub" | jq -r '.doi')\`"
            echo "- concept id: \`$(printf '%s' "$pub" | jq -r '.conceptrecid')\` — set this as the repository variable \`ZENODO_CONCEPT\` if it is not already"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the manifest to the GitHub release
        if: ${{ !inputs.dry_run && github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" manifest.txt --clobber
