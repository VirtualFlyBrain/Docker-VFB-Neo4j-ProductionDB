name: Publish Docker image

# Releases publish the release tag (as before). Pushes to pdb-k8s publish :pdb-k8s for testing on the cluster.
on:
  release:
    types: [published]
  push:
    branches: [pdb-k8s]
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub (with retries — auth.docker.io times out from runners at times)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          for i in 1 2 3 4 5 6; do
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin && exit 0
            echo "login attempt $i failed; retrying in 60s"; sleep 60
          done
          exit 1

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: virtualflybrain/docker-vfb-neo4j-productiondb

      - name: Build and push Docker image (retries — Docker Hub auth 5xx from runners at times)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=""; for t in $TAGS; do args="$args -t $t"; done
          for i in 1 2 3 4 5; do
            docker build --pull $args . && break
            echo "build attempt $i failed; retrying in 90s"; sleep 90
            [ "$i" = 5 ] && exit 1
          done
          for t in $TAGS; do
            for i in 1 2 3 4 5; do docker push "$t" && break; echo "push attempt $i failed; retrying in 60s"; sleep 60; [ "$i" = 5 ] && exit 1; done
          done
